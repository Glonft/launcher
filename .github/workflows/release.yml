# Nowa wersja launchera: zmień "version" w package.json i zrób push na main.
# GitHub zbuduje instalator Windows (.exe) i Linux (.AppImage), utworzy tag
# v<wersja> i wydanie w Releases. Zainstalowane launchery same się zaktualizują.
# Można też uruchomić ręcznie: Actions → Release launcher → Run workflow.
name: Release launcher

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
