# Wypchnij tag v* (np. git tag v0.1.1 && git push --tags), a GitHub zbuduje
# instalator Windows (.exe) i Linux (.AppImage) i wrzuci je do Releases.
# Zainstalowane launchery same pobiorą aktualizację.
name: Release launcher

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
